name: Publish GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Enable GitHub Pages for the homepage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload='{"source":{"branch":"master","path":"/"}}'
          if gh api "repos/${{ github.repository }}/pages" > /dev/null 2>&1; then
            printf '%s\n' "$payload" | gh api "repos/${{ github.repository }}/pages" -X PUT --input -
          else
            printf '%s\n' "$payload" | gh api "repos/${{ github.repository }}/pages" -X POST --input -
          fi
